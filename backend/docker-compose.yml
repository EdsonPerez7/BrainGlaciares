version: '3.8'

services:
  brainglaciares-backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HORNEAR_MODELO: 0
    image: brainglaciares-backend:latest
    container_name: brainglaciares_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - EMBEDDER=ninguno
      - CORS_ORIGENES=*
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/salud')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
